# EasyClean Somerset: the price list.
#
# This is the ONE place prices live. When GitHub builds the site it writes
# the price rows on the homepage (index.html) and the landlord and agent page
# (agents.html), and the price list Google sees, from this file. The booking
# system reads its prices from those pages, so it follows automatically.
#
# To change a price: edit the number after price: and commit.
# The site updates in about a minute. Nothing else to change.
#
# Each item:
#   item:        the name used in the basket, booking emails and invoices.
#                Change with care: past bookings keep the old name.
#   shown_as:    (optional) a shorter name shown in the price row.
#   price:       in pounds, whole number, no £ sign.
#   mins:        roughly how long it takes, in minutes.
#   meta:        the small grey line under the name. Leave as "" for none.
#   agents:      true to show it on the landlord and agent page too.
#   google_name: how it's listed in Google's price data.
#   group:       which section it sits in (rooms, sofas, mattresses, rugs,
#                vehicle). Leave these as they are.


# ---- Rooms ----

- item: "Small room"
  price: 35
  mins: 25
  meta: "Bedroom, hallway"
  agents: true
  google_name: "Small room carpet cleaning"
